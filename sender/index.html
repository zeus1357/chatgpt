<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이폰으로 블루투스 파일 보내기</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 24px 16px; line-height: 1.5; }
  h1 { font-size: 1.3rem; }
  button, input[type=file] { font-size: 1rem; }
  button { padding: 10px 16px; border-radius: 8px; border: 1px solid #8888; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .step { margin: 20px 0; }
  progress { width: 100%; height: 14px; }
  #status { min-height: 1.5em; font-weight: 600; }
  .error { color: #c62828; }
  .ok { color: #2e7d32; }
  .hint { font-size: .9rem; opacity: .75; }
</style>
</head>
<body>
<h1>아이폰으로 블루투스 파일 보내기</h1>
<p class="hint">아이폰에서 「블루투스 파일 감지」 앱을 화면에 띄워 둔 상태에서 사용하세요. Chrome 또는 Edge (PC·Mac·안드로이드)에서 동작합니다.</p>

<div class="step">
  <button id="connect">1. 아이폰 연결</button>
  <span id="device" class="hint"></span>
</div>
<div class="step">
  <input id="file" type="file" disabled>
</div>
<div class="step">
  <button id="send" disabled>2. 보내기</button>
  <button id="cancel" hidden>취소</button>
</div>
<progress id="progress" value="0" max="1" hidden></progress>
<p id="status"></p>

<script src="protocol.js"></script>
<script>
const P = BtProto;
const $ = (id) => document.getElementById(id);
const SYNC_EVERY = 20;      // 이 개수마다 한 번은 응답을 기다려 아이폰이 따라올 시간을 준다
const DONE_TIMEOUT_MS = 15000;

let writeChar = null;
let sending = false;
let cancelled = false;
let remoteError = null;
let onDone = null;

function setStatus(text, cls = '') {
  $('status').textContent = text;
  $('status').className = cls;
}

function updateButtons() {
  const connected = !!writeChar;
  $('file').disabled = !connected || sending;
  $('send').disabled = !connected || sending || !$('file').files.length;
  $('connect').disabled = sending;
  $('cancel').hidden = !sending;
}

if (!navigator.bluetooth) {
  setStatus('이 브라우저는 Web Bluetooth를 지원하지 않습니다. PC·Mac·안드로이드의 Chrome 또는 Edge를 사용하세요.', 'error');
  $('connect').disabled = true;
}

$('connect').addEventListener('click', async () => {
  try {
    setStatus('기기를 선택하세요…');
    const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [P.SERVICE_UUID] }] });
    device.addEventListener('gattserverdisconnected', () => {
      writeChar = null;
      $('device').textContent = '';
      if (!sending) setStatus('연결이 끊겼습니다.', 'error');
      updateButtons();
    });
    setStatus('연결 중…');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(P.SERVICE_UUID);
    const status = await service.getCharacteristic(P.STATUS_UUID);
    status.addEventListener('characteristicvaluechanged', (event) => {
      const result = P.parseStatus(event.target.value);
      if (result.type === 'error') remoteError = result.message || '아이폰에서 오류가 발생했습니다.';
      if (result.type !== 'unknown' && onDone) onDone();
    });
    await status.startNotifications();
    writeChar = await service.getCharacteristic(P.WRITE_UUID);
    $('device').textContent = '연결됨: ' + (device.name || '아이폰');
    setStatus('보낼 파일을 고르세요.');
  } catch (error) {
    writeChar = null;
    if (error.name !== 'NotFoundError') setStatus('연결 실패: ' + error.message, 'error');
    else setStatus('');
  }
  updateButtons();
});

$('file').addEventListener('change', updateButtons);
$('cancel').addEventListener('click', () => { cancelled = true; });

$('send').addEventListener('click', async () => {
  const file = $('file').files[0];
  if (!file || !writeChar) return;
  const char = writeChar;
  sending = true;
  cancelled = false;
  remoteError = null;
  updateButtons();
  $('progress').hidden = false;
  $('progress').value = 0;
  const startedAt = performance.now();

  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const done = new Promise((resolve) => { onDone = resolve; });
    await char.writeValueWithResponse(P.startPacket(file.name, bytes.length));

    let fast = true;
    let count = 0;
    let sent = 0;
    for (const packet of P.dataPackets(bytes)) {
      if (remoteError) throw new Error(remoteError);
      if (cancelled) {
        await char.writeValueWithResponse(P.cancelPacket());
        throw new Error('전송을 취소했습니다.');
      }
      count += 1;
      if (fast && count % SYNC_EVERY !== 0) {
        try {
          await char.writeValueWithoutResponse(packet);
        } catch (e) {
          // 응답 없는 쓰기를 못 쓰는 연결이면 느리지만 확실한 방식으로 바꾼다.
          fast = false;
          await char.writeValueWithResponse(packet);
        }
      } else {
        await char.writeValueWithResponse(packet);
      }
      sent += packet.length - 5;
      $('progress').value = sent / bytes.length;
      const seconds = (performance.now() - startedAt) / 1000;
      setStatus(`보내는 중… ${Math.round(sent / bytes.length * 100)}% (${(sent / 1024 / Math.max(seconds, 0.1)).toFixed(1)} KB/s)`);
    }
    await char.writeValueWithResponse(P.endPacket());

    const timeout = new Promise((_, reject) =>
      setTimeout(() => reject(new Error('아이폰의 완료 응답이 없습니다. 앱에서 받은 파일을 확인하세요.')), DONE_TIMEOUT_MS));
    await Promise.race([done, timeout]);
    if (remoteError) throw new Error(remoteError);
    $('progress').value = 1;
    setStatus(`전송 완료: ${file.name}`, 'ok');
  } catch (error) {
    setStatus('전송 실패: ' + error.message, 'error');
  } finally {
    onDone = null;
    sending = false;
    updateButtons();
  }
});
</script>
</body>
</html>
